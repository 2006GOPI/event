version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas_postgres
    restart: always
    environment:
      POSTGRES_USER: atlas_user
      POSTGRES_PASSWORD: atlas_password_2026
      POSTGRES_DB: atlas_workspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_user -d atlas_workspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://atlas_user:atlas_password_2026@postgres:5432/atlas_workspace
      SECRET_KEY: atlas-super-secret-key-change-in-production-2026
      CORS_ORIGINS: http://localhost:5174,http://localhost:3000,http://localhost:5173
      AI_PROVIDER: ""
      AI_API_KEY: ""
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5174:80"

volumes:
  postgres_data:
